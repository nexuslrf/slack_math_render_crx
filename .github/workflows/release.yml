name: Prepare draft release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Check release version and notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, accessSync } from 'node:fs';
          const tag = process.env.RELEASE_TAG;
          if (!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error('Expected a vX.Y.Z tag');
          for (const file of ['package.json', 'extension/manifest.json', 'dist/slack-math-viewer/manifest.json']) {
            if (`v${JSON.parse(readFileSync(file)).version}` !== tag) throw new Error(`Version mismatch: ${file}`);
          }
          accessSync(`docs/releases/${tag}.md`);
          JS
      - run: npm ci
      - run: npm run build
      - name: Check committed extension matches source
        run: git diff --exit-code -- dist/slack-math-viewer
      - run: npx playwright install --with-deps chromium
      - run: npm test

  release:
    name: Create draft and upload package
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Package verified extension
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/package.py
          mv dist/slack-math-viewer.zip "dist/slack-math-viewer-${RELEASE_TAG}.zip"
          cd dist
          sha256sum "slack-math-viewer-${RELEASE_TAG}.zip" > SHA256SUMS.txt
          unzip -t "slack-math-viewer-${RELEASE_TAG}.zip"
      - name: Prepare GitHub draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          archive="dist/slack-math-viewer-${RELEASE_TAG}.zip"
          notes="docs/releases/${RELEASE_TAG}.md"
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo 'Refusing to change an already published release.' >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "$archive" dist/SHA256SUMS.txt --clobber
            gh release edit "$RELEASE_TAG" --title "Slack Math Viewer ${RELEASE_TAG}" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" "$archive" dist/SHA256SUMS.txt \
              --draft --verify-tag --title "Slack Math Viewer ${RELEASE_TAG}" --notes-file "$notes"
          fi
          gh release view "$RELEASE_TAG" --json url,isDraft,tagName,assets
          gh release view "$RELEASE_TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
